# Development override for compose.yaml: reloads on code changes and refreshes upstream data quickly.
#
#   docker compose -f compose.yaml -f compose.dev.yaml up --build --watch
#
# Templates, static files and Python sources are synced into the running container and gunicorn
# restarts its worker. Changing requirements.txt or the Dockerfile needs the rebuild that `up --build` does.
# The D2 diagrams (data/*.d2) are rendered at image build time, so editing one needs `up --build` again.

services:
  docs:
    command: ["gunicorn", "-c", "gunicorn.conf.py", "--reload", "app:app"]
    environment:
      FLASK_DEBUG: "1"
      # Package data and health checks are re-read after seconds instead of hours/seconds.
      CACHE_TTL_SECONDS: "10"
      HEALTH_TTL_SECONDS: "5"
    develop:
      watch:
        # The app lives in / inside the image (no WORKDIR), so the targets are root-level.
        - action: sync
          path: ./templates
          target: /templates
        - action: sync
          path: ./static
          target: /static
        - action: sync
          path: ./src
          target: /src
        - action: sync
          path: ./app.py
          target: /app.py
        - action: sync
          path: ./helper.py
          target: /helper.py
